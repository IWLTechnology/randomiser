<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>IWLTech Randomiser</title>

    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <meta name="robots" content="notranslate" />
    <meta name="description" content="A random picker with many different uses." />
    <meta name="og:description" content="A random picker with many different uses." />
    <meta property="og:title" content="IWLTech Randomiser" />
    <meta name="twitter:card" content="summary" />
    <meta name="theme-color" content="#000000" />
    <meta property="og:type" content="website" />

    <link rel="stylesheet" href="style.css" />

    <script src="./lists.js"></script>
    <script src="./script.js"></script>
  </head>
  <body onload="init()">
    <div id="main">
      <p id="result">The result of your random pick will appear here.</p>
      <p id="info">You can also change the background where applicable.</p>
      <br />
      <button onclick="button(0)">Pick Random!</button>
      <button onclick="button(1)">Settings</button>
    </div>
    <div id="set" class="hide o-hide">
      <div>
        <p>Settings:</p>
        <select id="mode">
          <option value="colour">Pick a random colour (basic)</option>
          <option value="colour2">Pick a random colour (advanced)</option>
          <option value="twister">Twister spinner</option>
        </select>
        <br />
        <br />
        <input id="changebg" type="checkbox" checked /><span>Change background on random click (if applicable)</span>
        <br />
        <br />
        <input id="transitions" type="checkbox" checked /><span>Enable transitions (recommended)</span>
        <br />
        <br />
        <input id="tts" type="checkbox" checked /><span>Enable speech synthesis</span>
        <br />
        <br />
        <span>Pick automatically every <input id="autoPick" value="0" /> seconds (0 to disable).</span>
        <br />
        <br />
        <button onclick="button(2)">Cancel</button>
        <button class="red" onclick="resetStorage();init()">Reset all settings</button>
        <button onclick="button(3)">Accept</button>
      </div>
    </div>
  </body>
</html>
