<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>IWLTech Randomiser</title>

    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <meta name="robots" content="notranslate" />
    <meta name="description" content="A random picker for many different uses." />
    <meta name="og:description" content="A random picker for many different uses." />
    <meta property="og:title" content="IWLTech Randomiser" />
    <meta name="twitter:card" content="summary" />
    <meta name="theme-color" content="#000000" />
    <meta property="og:type" content="website" />

    <link rel="stylesheet" href="w3.css" />
    <link rel="stylesheet" href="style.css" />

    <script src="lists.js"></script>
    <script src="script.js"></script>
  </head>
  <body onload="init()">
    <div id="main">
      <div class="centerMe" style="width: 98vw">
        <p id="result" class="fullText">The result of your random pick will appear here.</p>
        <p id="canChangeBg">You can also change the background where applicable.</p>
        <br />
        <button class="w3-purple w3-btn w3-round-xxlarge w3-ripple w3-center w3-bar-item" onclick="button(0)">
          Pick Random!
        </button>
        <button class="w3-purple w3-btn w3-round-xxlarge w3-ripple w3-center w3-bar-item" onclick="button(1)">
          Settings
        </button>
      </div>
    </div>
    <div id="set">
      <div class="centerMe">
        <p class="fullText" style="font-size: 1.5em">Settings:</p>
        <select class="w3-select w3-round-xlarge w3-padding" id="mode">
          <option value="colour">Pick a random colour (basic)</option>
          <option value="colour2">Pick a random colour (advanced)</option>
          <option value="twister">Twister spinner</option>
        </select>
        <br />
        <br />
        <input id="changebg" type="checkbox" class="w3-check" checked /><span
          >Change background on random click (if applicable)</span
        >
        <br />
        <br />
        <input id="transitions" type="checkbox" class="w3-check" checked /><span>Enable transitions (recommended)</span>
        <br />
        <br />
        <input id="tts" type="checkbox" class="w3-check" checked /><span>Enable speech synthesis</span>
        <br />
        <br />
        <span
          >Pick automatically every <input class="w3-round-xlarge w3-padding" id="autoPick" value="0" /> seconds (0 to
          disable).</span
        >
        <br />
        <br />
        <button class="w3-purple w3-btn w3-round-xxlarge w3-ripple w3-center w3-bar-item" onclick="button(2)">
          Cancel
        </button>
        <button class="w3-red w3-btn w3-round-xxlarge w3-ripple w3-center w3-bar-item" onclick="resetStorage();init()">
          Reset all settings
        </button>
        <button class="w3-purple w3-btn w3-round-xxlarge w3-ripple w3-center w3-bar-item" onclick="button(3)">
          Accept
        </button>
      </div>
    </div>
  </body>
</html>
